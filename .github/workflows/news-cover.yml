name: 뉴스 대표 이미지

# 마작 뉴스 글이 main 에 올라오면 cover 가 없는 글의 대표 이미지를 만들어 커밋한다.
# (이 워크플로가 하는 커밋은 GITHUB_TOKEN 으로 푸시하므로 자기 자신을 다시 실행시키지 않는다.)
on:
  push:
    branches: [main]
    paths:
      - "src/content/news/**.md"
  workflow_dispatch:
    inputs:
      slug:
        description: "글 이름 (예: 2026-10-22-m-league-premium-night). 비우면 cover 없는 뉴스 글 전부"
        required: false
      force:
        description: "이미 이미지가 있어도 다시 만들기"
        type: boolean
        default: false

concurrency:
  group: news-cover
  cancel-in-progress: false

jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: 대표 이미지 만들기
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLUG: ${{ inputs.slug }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::저장소 Secrets 에 OPENAI_API_KEY 가 없습니다 (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          node scripts/gen-cover.mjs $SLUG $FORCE

      - name: 커밋
        if: always()
        run: |
          git config user.name "mahjong-gamu-bot"
          git config user.email "mahjong-gamu@users.noreply.github.com"
          git add public/images/news src/content/news scripts/cover-prompts.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -q -m "뉴스 대표 이미지 추가"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
