# 예약 게시: 15분마다 publishAt 시각이 지난 글을 찾아 공개합니다 (scripts/publish-scheduled.mjs).
# 매시 정각은 GitHub가 붐벼 늦어지기 쉬워서 7·22·37·52분에 돌립니다.
name: 예약 게시

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: 시각이 지난 예약 글 공개
        run: |
          titles=$(node scripts/publish-scheduled.mjs)
          if git diff --quiet; then
            echo "공개할 예약 글이 없습니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "예약 글 게시: $(echo "$titles" | paste -sd '·' -)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
