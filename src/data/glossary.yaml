# ───────── 추가 5개 (11/14 마작껌 결정) ─────────
- id: daten
  term: 타점
  ja: 打点
  aka: [점수 크기, 고타점, 저타점]
  category: 수비·전략
  short: 화료했을 때 받는 점수의 크기. 「타점이 높다·낮다」처럼 씁니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    손이 얼마나 빨리 화료할 수 있는지(속도)와 짝을 이루는 말입니다. 역과 도라가 많아 판수가 높으면 「타점이 높은 손」, 1,000점짜리 손은 「타점이 낮은 손」입니다.
    공수 판단에서 가장 먼저 보는 것 가운데 하나입니다. 내 타점이 높으면 위험패를 밀 값이 있고, 낮으면 내리는 쪽이 낫습니다. 상대의 타점이 얼마나 될지 짐작하는 것은 「타점 읽기」라고 합니다.
  related: [han, dora, yaku, oshihiki, mangan]
  sources:
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=121
    - https://gall.dcinside.com/board/view/?id=majak&no=596984
  check: false

- id: ashisuto
  term: 어시스트
  ja: アシスト
  aka: [도와주기, 아시스트]
  category: 수비·전략
  short: 다른 사람이 화료하도록, 그 사람이 울 만한 패를 일부러 내주는 것.
  tiles: null
  han: null
  rule_note: null
  detail: |
    내가 화료하기 어려울 때, 싼 손으로 후로한 사람이 빨리 화료하게 도와서 더 위험한 상대(친의 연장, 높은 리치)를 막는 방법입니다. 오라스에 내 순위를 지켜 줄 사람을 돕는 경우도 있습니다.
    울 패를 내주는 데서 그치면 어시스트, 화료패까지 일부러 내주면 **사시코미**입니다. 반대로 울 패를 안 내주는 것은 **시보리**입니다.
  related: [sashikomi, shibori, furo, orasu, oshihiki]
  sources:
    - https://gall.dcinside.com/board/view/?id=majak&no=596984
  check: false

- id: orasu-joken
  term: 오라스 조건
  ja: 条件
  aka: [조건, 역전 조건, 순위 조건]
  category: 수비·전략
  short: 오라스에 순위를 올리려면 필요한 점수와 화료 방법. 「하네만 쯔모 조건」처럼 부릅니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    오라스에는 화료해도 순위가 그대로면 의미가 적으므로, 먼저 「몇 점이 필요한가」를 셉니다. 같은 점수 차이라도 화료 방법에 따라 조건이 달라집니다.
    - **직격**: 내가 받는 만큼 상대가 잃어서, 차이가 화료 점수의 두 배만큼 줄어듭니다.
    - **쯔모**: 세 사람이 나눠 내므로, 상대가 친인지 자인지에 따라 줄어드는 폭이 다릅니다.
    - **다른 사람에게서 론**: 화료 점수만큼만 줄어듭니다.
    본장과 공탁(리치봉)도 함께 셉니다. 조건에 못 미치는 화료패는 일부러 넘기기도 합니다(미노가시).
  related: [orasu, chokugeki, minogashi, juniten, honba, kyotaku]
  sources:
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
  check: false

- id: suji-kaunto
  term: 스지 카운트
  ja: 筋カウント
  aka: [스지 카운팅, 1/18 이론]
  category: 수비·전략
  short: 리치한 사람에게 이미 통과한 스지 수를 세어, 남은 무스지가 얼마나 위험한지 가늠하는 방법.
  tiles: null
  han: null
  rule_note: null
  detail: |
    양면 대기가 될 수 있는 스지는 수패 한 종류에 6개(1-4, 2-5, 3-6, 4-7, 5-8, 6-9), 세 종류를 합쳐 **18개**입니다. 리치가 양면 대기라면 이 18개 가운데 하나가 화료패입니다.
    현물이나 통과한 패가 나올 때마다 스지가 지워집니다. `4m` 가 통과하면 1-4와 4-7 두 개, `1m` 가 통과하면 1-4 한 개가 지워집니다. 지워진 스지가 많을수록 남은 무스지 하나하나가 맞을 가능성은 커집니다.
    그래서 초반 리치에는 무스지를 밀 만해도, 스지가 많이 통과한 종반에는 같은 무스지가 훨씬 위험합니다. 대기가 양면이 아닐 수도 있으므로 어림하는 기준으로만 씁니다.
  related: [suji, anzenhai, oshihiki, ryanmen, genbutsu]
  sources:
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
  check: false

- id: hojuritsu-agariritsu
  term: 방총률 / 화료율
  ja: 放銃率 / 和了率
  aka: [방총율, 화료률, 아가리율, 쏘임률]
  category: 수비·전략
  short: 전체 국 가운데 내가 방총한 국의 비율 / 내가 화료한 국의 비율.
  tiles: null
  han: null
  rule_note: 작혼 전적 화면에는 「방총」「화료」로만 적혀 있지만, 뜻은 방총률·화료율입니다.
  detail: |
    여러 대국을 모아서 보는 성적 지표입니다. 방총률은 수비가, 화료율은 공격이 어느 쪽으로 치우쳤는지 보여 줍니다.
    둘은 함께 봐야 합니다. 방총률만 낮추려고 늘 내리면 화료율도 함께 내려가고, 화료율만 올리려고 늘 밀면 방총률이 올라갑니다. 그 균형을 잡는 것이 **공수 판단**입니다.
    후로율·리치율과 함께 보면 치는 방식의 버릇을 알 수 있습니다.
  related: [hoju, agari, oshihiki, betaori, zentsu]
  sources:
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=304
  check: false   # 작혼 전적 화면 표기는 마작껌 확인(11/14)
