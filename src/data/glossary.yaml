  term: 공탁
  ja: 供託
  aka: [공탁봉]
  category: 진행·기본
  short: 리치 때 낸 1,000점 막대가 주인 없이 탁자에 남아 있는 것. 다음에 화료한 사람이 가져갑니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    리치한 사람이 화료하지 못하고 유국이 되면 리치봉은 탁자에 그대로 남습니다. 이것이 공탁이고, 다음 국 이후 **처음 화료한 사람**이 모두 가져갑니다.
    반장이 유국으로 끝나 공탁이 남으면 M리그와 작혼은 **1위**가 가져갑니다(M리그 9장 8조 5·6장 2조 5). 프로 단체 중에는 없애는 곳도 있습니다.
