- id: wanpai
  term: 왕패
  ja: 王牌
  aka: [왕패 14장]
  category: 진행·기본
  short: 패산 끝에 남겨 두는 14장. 도라 표시패와 영상패가 여기 있습니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    왕패 14장은 쯔모하지 않습니다. 이 안에 **도라 표시패**(처음 1장, 깡마다 1장씩 더)와 **영상패**(깡 뒤 보충패 4장)가 있습니다.
    깡으로 영상패를 한 장 가져가면 왕패가 14장을 유지하도록 패산 끝에서 한 장이 왕패로 넘어갑니다. 그래서 깡이 나오면 쯔모할 수 있는 패가 한 장 줄어듭니다.
  related: [yama, rinshanpai, dora-hyojihai, kan]
  sources:
    - /study/riichi-101-2/
  check: false

- id: rinshanpai
  term: 영상패
  ja: 嶺上牌
  aka: [린샹패]
  category: 진행·기본
  short: 깡을 한 뒤 왕패에서 가져오는 보충패.
  tiles: null
  han: null
  rule_note: null
  detail: |
    깡을 하면 손패가 한 장 모자라게 되므로 왕패에서 한 장을 보충합니다. 이 패가 영상패이고, 깡을 선언한 뒤에 가져옵니다(M리그 2장 5조).
    영상패로 화료하면 **영상개화**(1판)가 붙습니다.
  related: [kan, wanpai, rinshan-kaiho]
  sources:
    - https://mahjongsoul.yo-star.com/kr/classroom
    - https://m-league.jp/about/
  check: false

- id: dora-hyojihai
  term: 도라 표시패
  ja: ドラ表示牌
  aka: [도라표시패]
  category: 진행·기본
  short: 왕패에서 뒤집어 놓은 패. 이 패의 다음 차례 패가 도라입니다.
  tiles: "4m"
  han: null
  rule_note: null
  detail: |
    도라 표시패가 `4m` 이면 도라는 `5m` 입니다. 순서는 이렇게 돕니다.
    - 수패: 1→2→…→9→1 (표시패 `9p` 면 도라 `1p`)
    - 풍패: 동→남→서→북→동 (표시패 `4z` 면 도라 `1z`)
    - 삼원패: 백→발→중→백 (표시패 `7z` 면 도라 `5z`)
    깡을 할 때마다 옆 패를 한 장 더 뒤집어 깡도라가 늘어납니다. M리그는 깡이 확인되면 바로 뒤집습니다(4장 5조).
  related: [dora, kandora, wanpai]
  sources:
    - https://mahjongsoul.yo-star.com/kr/classroom
    - https://m-league.jp/about/
  check: false

- id: junme
  term: 순
  ja: 巡目
  aka: [순목, 바퀴]
  category: 진행·기본
  short: 네 사람이 한 번씩 쯔모하고 버리는 한 바퀴. 「5순째 리치」처럼 씁니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    내 버림패가 몇 장인지 세면 지금이 몇 순째인지 알 수 있습니다. 보통 6순까지를 초반, 12순 무렵부터를 종반으로 봅니다.
    「같은 순」은 내가 한 번 버린 뒤 다음 쯔모 전까지를 말합니다. 이때 화료패를 못 본 체하면 일시 후리텐이 됩니다.
  related: [sutehai, kawa, furiten]
  sources:
    - https://m-league.jp/about/
