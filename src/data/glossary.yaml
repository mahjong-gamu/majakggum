  term: 리치봉
  ja: 立直棒
  aka: [점봉, 천점봉, 1000점봉]
  category: 진행·기본
  short: 리치를 걸 때 탁자에 내는 1,000점짜리 점수 막대.
  tiles: null
  han: null
  rule_note: null
  detail: |
    리치를 선언하고 패를 버린 뒤, 그 패로 아무도 론하지 않으면 1,000점 막대를 내놓습니다(M리그 9장 8조 2). 리치한 사람이 화료하면 돌려받고, 다른 사람이 화료하면 그 사람이 가져갑니다. 아무도 화료하지 않으면 **공탁**으로 남습니다.
  related: [kyotaku, riichi]
  sources:
    - https://m-league.jp/about/
  check: false

- id: haipai
  term: 배패
  ja: 配牌
  aka: [처음 패]
  category: 진행·기본
  short: 국을 시작할 때 각자 받는 13장의 패.
  tiles: "1479m258p36s1257z"
  han: null
  rule_note: null
  detail: |
    각자 13장을 받고, 친이 먼저 한 장을 쯔모해 14장에서 한 장을 버리며 국이 시작됩니다. 위 예처럼 몸통이 하나도 없는 배패도 흔합니다.
    배패가 나쁘면(블록이 적고 자패가 많으면) 처음부터 수비를 생각하거나, 작혼이라면 구종구패를 고를 수 있습니다.
  related: [yama, kyushu-kyuhai, burokku]
  sources:
