- id: tonpusen-hanchan
  term: 동풍전 / 반장전
  ja: 東風戦 / 半荘戦
  aka: [동풍, 반장, 한장]
  category: 진행·기본
  short: 동장 4국만 치는 짧은 대국 / 동장·남장 8국을 치는 대국.
  tiles: null
  han: null
  rule_note: 작혼은 반장이 끝났을 때 1위가 30,000점에 못 미치면 서장으로 이어 가는 서입이 있습니다(동풍전은 남입).
  detail: |
    **동풍전**은 동1국~동4국, **반장전**은 동1국~남4국까지 칩니다(연장이 나오면 더 길어짐). M리그와 대부분의 프로 대회는 반장전입니다.
    M리그 공식전은 동장·남장 두 바람의 반장을 한 경기로 하고, 마지막 국이 끝나면 대국이 끝납니다(1장 1조).
  related: [kyoku, orasu, bakaze]
  sources:
