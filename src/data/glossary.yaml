- id: urasuji-matagisuji
  term: 우라스지 / 마타기스지
  ja: 裏筋 / 跨ぎ筋
  aka: [뒷스지, 뒷줄기, 걸침 스지]
  category: 수비·전략
  short: 버림패 바로 옆 패의 스지 / 버림패를 사이에 낀 스지. 둘 다 위험하다고 보는 읽기입니다.
  tiles: "13m 4m"
  han: null
  rule_note: null
  detail: |
    **우라스지**: 위 그림처럼 `13m` 간짱에 `4m` 가 오면 `1m` 를 버리고 `34m` 양면(2·5m 대기)으로 바꿉니다. 그래서 `1m` 가 버려졌을 때 2·5m 를 우라스지라고 합니다. `5m` 가 버려졌다면 1·4m 와 6·9m 가 우라스지입니다.
    **마타기스지**: `556m` 에서 `5m` 를 버리면 `56m` 양면(4·7m 대기)이 남습니다. 이렇게 버림패를 사이에 낀 스지(`5m` 라면 3·6m 와 4·7m)가 마타기스지입니다. 리치 선언패처럼 늦게 손에서 나온 패에 대해 주로 봅니다.
    둘 다 「그렇게 버렸을 수도 있다」는 짐작이라, 현물·스지·벽처럼 확실한 근거는 아닙니다.
  related: [suji, aidayonken, riichi-sengenhai, tsumogiri-tedashi, kanchan, ryanmen]
  sources:
    - https://namu.wiki/w/%EB%A6%AC%EC%B9%98%EB%A7%88%EC%9E%91/%EC%9A%A9%EC%96%B4
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=121
  check: false

- id: aidayonken
  term: 아이다욘켄
  ja: 間四軒
  aka: [사이 4칸, 아이다 욘켄]
  category: 수비·전략
  short: 같은 종류에서 4칸 떨어진 두 패가 버려졌을 때, 그 사이의 스지가 위험하다고 보는 읽기.
  tiles: "2s 7s"
  han: null
  rule_note: null
  detail: |
    상대 버림패에 `2s` 와 `7s` 가 있으면 그 사이의 3·6s 가 아이다욘켄입니다. `2s` 의 우라스지도 3·6s, `7s` 의 우라스지도 3·6s 라서 두 번 겹치기 때문입니다.
    짝은 네 가지입니다: 1·6 → 2·5, 2·7 → 3·6, 3·8 → 4·7, 4·9 → 5·8.
    우라스지와 마찬가지로 짐작이므로, 다른 근거가 없을 때 참고하는 정도로 씁니다.
  related: [urasuji-matagisuji, suji, anzenhai]
