  detail: |
    네 사람 앞에 17장씩 2단으로 쌓아 모두 136장입니다. 배패를 나눈 뒤 남은 패를 차례로 쯔모하고, 끝의 14장(왕패)은 쯔모하지 않습니다.
    패산의 마지막 한 장을 쯔모해 화료하면 **해저로월**, 그 마지막 버림패로 론하면 **하저로어**입니다.
  related: [wanpai, haipai, haitei]
