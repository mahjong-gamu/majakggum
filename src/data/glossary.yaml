# ───────── 11/13 추가 (마작껌 결정) ─────────
- id: kamicha-shimocha-toimen
  term: 상가 / 하가 / 대면
  ja: 上家 / 下家 / 対面
  aka: [카미차, 시모차, 토이멘, 앞 사람, 다음 사람, 맞은편]
  category: 진행·기본
  short: 나를 기준으로 바로 앞 차례 사람(왼쪽), 다음 차례 사람(오른쪽), 맞은편 사람.
  tiles: null
  han: null
  rule_note: null
  detail: |
    차례는 내 오른쪽 사람(**하가**) → 맞은편(**대면**) → 왼쪽 사람(**상가**) 순서로 돕니다. 내 패를 버리면 다음에 쯔모하는 사람이 하가입니다.
    **치**는 상가의 버림패로만 할 수 있습니다. 퐁한 패를 눕히는 위치도 상가(왼쪽)·대면(가운데)·하가(오른쪽)로 정해져 있어, 누구에게서 가져왔는지 보입니다.
    M리그는 한 패에 여러 명이 론하면 버린 사람의 하가 → 대면 → 상가 순서로 한 사람만 화료합니다(5장 1조).
  related: [chi, pon, ron, oya-ko]
  sources:
    - https://m-league.jp/about/
    - /study/riichi-101-4/
  check: false

- id: chicha
