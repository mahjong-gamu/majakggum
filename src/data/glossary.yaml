  short: 쯔모한 패를 그대로 버림 / 손에 있던 패를 골라 버림.
  tiles: null
  han: null
  rule_note: null
  detail: |
    실제 탁에서는 손 동작(쯔모한 패를 그대로 내는지, 손패에서 꺼내는지)으로 구분합니다. 작혼도 대국 중에는 손 동작으로만 보이고, **복기(패보) 화면에서만** 쯔모기리한 패가 어둡게 표시됩니다. 리치한 사람은 계속 쯔모기리만 합니다.
    상대가 **테다시**를 하면 손 모양이 바뀌었다는 뜻이라, 텐파이가 가까워졌는지 읽는 단서가 됩니다.
