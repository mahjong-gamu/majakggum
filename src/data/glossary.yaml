  term: 장풍
  ja: 場風
  aka: [장풍패]
  category: 진행·기본
  short: 그 판의 바람. 동장이면 동, 남장이면 남입니다.
  tiles: "12z"
  han: null
  rule_note: null
  detail: |
    반장전은 **동장**(동1국~동4국)과 **남장**(남1국~남4국)으로 나뉩니다. 동장에서는 동 `1z`, 남장에서는 남 `2z` 가 장풍입니다. 네 사람 모두 같은 장풍을 씁니다.
    장풍 커쯔는 **역패** 1판입니다.
