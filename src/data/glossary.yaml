  tiles: "4^23m"
  han: null
  rule_note: null
  detail: |
    후로하면 멘젠이 아니게 되어 **리치를 걸 수 없고**, 멘젠에서만 되는 역(핑후·이페코 등)은 없어지며, 일부 역은 판수가 1판 줄어듭니다(일기통관·삼색동순·찬타·혼일색 등). 안깡은 후로로 치지 않습니다.
    대신 빠르게 텐파이할 수 있어서, 역패나 탕야오(쿠이탕)처럼 후로해도 되는 역이 있을 때 씁니다.
