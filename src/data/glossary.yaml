- id: dora-hyojihai
  term: 도라 표시패
  ja: ドラ表示牌
  aka: [도라표시패]
  category: 진행·기본
  short: 왕패에서 뒤집어 놓은 패. 이 패의 다음 차례 패가 도라입니다.
  tiles: "4m"
  han: null
  rule_note: null
  detail: |
    도라 표시패가 `4m` 이면 도라는 `5m` 입니다. 순서는 이렇게 돕니다.
    - 수패: 1→2→…→9→1 (표시패 `9p` 면 도라 `1p`)
    - 풍패: 동→남→서→북→동 (표시패 `4z` 면 도라 `1z`)
    - 삼원패: 백→발→중→백 (표시패 `7z` 면 도라 `5z`)
    깡을 할 때마다 옆 패를 한 장 더 뒤집어 깡도라가 늘어납니다. M리그는 깡이 확인되면 바로 뒤집습니다(4장 5조).
  related: [dora, kandora, wanpai]
  sources:
    - https://mahjongsoul.yo-star.com/kr/classroom
    - https://m-league.jp/about/
  check: false

