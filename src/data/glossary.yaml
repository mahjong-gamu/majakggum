    - 간짱·변짱·단기 대기 2부 · 역패 머리 2부
    - 커쯔: 2~8 밍커 2부·안커 4부, 1·9·자패는 두 배(밍커 4부·안커 8부). 깡쯔는 커쯔의 4배
    예외: 치또이쯔는 늘 25부, 핑후 쯔모는 20부, 후로한 손을 핑후 모양으로 론하면 30부입니다.
