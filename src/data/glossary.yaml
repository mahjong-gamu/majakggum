- id: wanpai
  term: 왕패
  ja: 王牌
  aka: [왕패 14장]
  category: 진행·기본
  short: 패산 끝에 남겨 두는 14장. 도라 표시패와 영상패가 여기 있습니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    왕패 14장은 쯔모하지 않습니다. 이 안에 **도라 표시패**(처음 1장, 깡마다 1장씩 더)와 **영상패**(깡 뒤 보충패 4장)가 있습니다.
    깡으로 영상패를 한 장 가져가면 왕패가 14장을 유지하도록 패산 끝에서 한 장이 왕패로 넘어갑니다. 그래서 깡이 나오면 쯔모할 수 있는 패가 한 장 줄어듭니다.
  related: [yama, rinshanpai, dora-hyojihai, kan]
