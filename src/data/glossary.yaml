- id: oya-ko
  term: 친 / 자
  ja: 親 / 子
  aka: [오야, 코, 친가, 자가]
  category: 진행·기본
  short: 그 국에서 친을 맡은 한 사람과, 나머지 세 사람.
  tiles: null
  han: null
  rule_note: null
  detail: |
    국마다 네 사람 중 한 명이 **친**, 나머지 세 명이 **자**가 됩니다. 친은 동가에 앉고, 친이 바뀌면 자리 바람(자풍)도 함께 한 칸씩 옮겨 갑니다.
    친은 화료하면 자보다 **1.5배** 점수를 받고, 쯔모를 당하면 자보다 두 배를 냅니다. 그래서 친일 때 공격적으로 치는 경우가 많습니다.
    친이 화료하거나 유국 때 텐파이면 친을 그대로 이어 가고(연장), 그렇지 않으면 오른쪽 사람(하가)에게 친이 넘어갑니다.
  related: [jikaze, renchan, kyoku]
  sources:
    - https://mahjongsoul.yo-star.com/kr/classroom
    - https://m-league.jp/about/
    - /study/riichi-101-2/
  check: false

- id: jikaze
  term: 자풍
  ja: 自風
  aka: [자풍패, 문풍]
  category: 진행·기본
  short: 내 자리의 바람. 친이 동, 그다음 차례가 남·서·북입니다.
  tiles: "1234z"
  han: null
  rule_note: null
  detail: |
    친이 **동**, 친의 오른쪽(다음 차례)이 **남**, 그다음이 **서**, 친의 왼쪽이 **북**입니다. 친이 바뀌면 모두의 자풍도 바뀝니다.
    자풍과 같은 풍패 3장(커쯔)을 모으면 **역패**로 1판이 됩니다. 자풍이 장풍과 같으면(예: 동장의 친에게 동) 두 번 세어 2판인 **연풍패**가 됩니다.
  related: [bakaze, kazehai, yakuhai, renpuhai, oya-ko]
  sources:
    - https://mahjongsoul.yo-star.com/kr/classroom
  check: false

- id: bakaze
  term: 장풍
  ja: 場風
  aka: [장풍패]
  category: 진행·기본
  short: 그 판의 바람. 동장이면 동, 남장이면 남입니다.
  tiles: "12z"
  han: null
  rule_note: null
  detail: |
    반장전은 **동장**(동1국~동4국)과 **남장**(남1국~남4국)으로 나뉩니다. 동장에서는 동 `1z`, 남장에서는 남 `2z` 가 장풍입니다. 네 사람 모두 같은 장풍을 씁니다.
    장풍 커쯔는 **역패** 1판입니다.
  related: [jikaze, kyoku, tonpusen-hanchan, yakuhai]
  sources:
    - https://mahjongsoul.yo-star.com/kr/classroom
  check: false

- id: tonpusen-hanchan
  term: 동풍전 / 반장전
  ja: 東風戦 / 半荘戦
  aka: [동풍, 반장, 한장]
  category: 진행·기본
  short: 동장 4국만 치는 짧은 대국 / 동장·남장 8국을 치는 대국.
  tiles: null
  han: null
  rule_note: 작혼은 반장이 끝났을 때 1위가 30,000점에 못 미치면 서장으로 이어 가는 서입이 있습니다(동풍전은 남입).
  detail: |
    **동풍전**은 동1국~동4국, **반장전**은 동1국~남4국까지 칩니다(연장이 나오면 더 길어짐). M리그와 대부분의 프로 대회는 반장전입니다.
    M리그 공식전은 동장·남장 두 바람의 반장을 한 경기로 하고, 마지막 국이 끝나면 대국이 끝납니다(1장 1조).
  related: [kyoku, orasu, bakaze]
  sources:
    - https://m-league.jp/about/
    - /study/rules-mahjongsoul-vs-pro/
  check: false

- id: kyoku
  term: 국
  ja: 局
  aka: [판]
  category: 진행·기본
  short: 패를 받아 누군가 화료하거나 유국할 때까지의 한 판. 동1국, 남3국처럼 부릅니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    한 국은 배패 → 쯔모와 버리기 반복 → 화료나 유국으로 끝납니다. 이름은 「장풍 + 몇 번째 친」으로, 동장의 세 번째 친이면 **동3국**입니다.
    친이 연장하면 국 번호는 그대로이고 본장만 늘어납니다(예: 동3국 1본장).
  related: [oya-ko, honba, renchan, ryukyoku, agari]
  sources:
    - /study/riichi-101-2/
    - https://m-league.jp/about/
  check: false

- id: orasu
  term: 오라스
  ja: オーラス
  aka: [올라스트, 마지막 국]
  category: 진행·기본
  short: 대국의 마지막 국. 반장전이면 남4국입니다.
  tiles: null
  han: null
  rule_note: 작혼은 오라스에 1위인 친이 화료·텐파이하면 연장하지 않고 끝낼 수 있습니다(M리그는 그대로 연장).
  detail: |
    영어 all last에서 온 말입니다. 순위가 정해지는 국이라 「몇 점이 필요한가」를 계산해서 치는 경우가 많습니다. 예를 들어 3위가 2위를 넘으려면 만관이 필요하다면, 낮은 점수의 빠른 화료는 의미가 없을 수 있습니다.
    M리그는 오라스에 1위인 친이 화료하거나 텐파이해도 끝나지 않고 연장합니다.
  related: [tonpusen-hanchan, kyoku, renchan]
  sources:
    - /study/rules-mahjongsoul-vs-pro/
    - https://m-league.jp/about/
  check: false

- id: honba
  term: 본장
  ja: 本場
  aka: [연장봉, 쓰미보, 백점봉]
  category: 진행·기본
  short: 친의 연장이나 유국 때마다 하나씩 쌓이는 막대. 1본장마다 화료 점수에 300점이 붙습니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    친이 연장하거나 유국이 나오면 본장이 1개 늘어납니다. 그 뒤 누가 화료하면 **본장 1개당 300점**을 더 받습니다. 론이면 방총한 사람이 300점, 쯔모면 세 사람이 100점씩 냅니다.
    M리그는 자가 화료하면 본장이 없어지고 0으로 돌아갑니다(3장 13조). 자 화료로 친이 넘어가면 다음 국은 0본장부터 시작합니다.
  related: [renchan, kyotaku, ryukyoku]
  sources:
    - https://m-league.jp/about/
    - /study/riichi-101-2/
  check: false

- id: renchan
  term: 연장
  ja: 連荘
  aka: [렌짱]
  category: 진행·기본
  short: 친이 화료하거나 유국 때 텐파이여서, 다음 국도 같은 사람이 친을 하는 것.
  tiles: null
  han: null
  rule_note: 작혼은 오라스에 1위 친이 연장하지 않고 끝낼 수 있습니다.
  detail: |
    M리그는 **친이 화료하거나, 유국 때 친이 텐파이면** 연장합니다. 친이 노텐이면 다음 사람에게 친이 넘어갑니다(3장 12조).
    연장하면 국 번호는 그대로 두고 본장을 1개 올립니다(예: 동1국 → 동1국 1본장).
  related: [oya-ko, honba, orasu, tenpai]
  sources:
    - https://m-league.jp/about/
    - /study/riichi-101-2/
  check: false

- id: kyotaku
  term: 공탁
  ja: 供託
  aka: [공탁봉]
  category: 진행·기본
  short: 리치 때 낸 1,000점 막대가 주인 없이 탁자에 남아 있는 것. 다음에 화료한 사람이 가져갑니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    리치한 사람이 화료하지 못하고 유국이 되면 리치봉은 탁자에 그대로 남습니다. 이것이 공탁이고, 다음 국 이후 **처음 화료한 사람**이 모두 가져갑니다.
    반장이 유국으로 끝나 공탁이 남으면 M리그와 작혼은 **1위**가 가져갑니다(M리그 9장 8조 5·6장 2조 5). 프로 단체 중에는 없애는 곳도 있습니다.
  related: [riichibo, honba, ryukyoku]
  sources:
    - https://m-league.jp/about/
    - /study/rules-mahjongsoul-vs-pro/
  check: false

