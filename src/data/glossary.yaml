  rule_note: 작혼 단위전은 시작 점수와 반환 점수가 둘 다 25,000점입니다. 1위가 30,000점에 못 미치면 서입하는 30,000점은 반환 점수가 아닙니다.
  detail: |
    M리그는 25,000점으로 시작하고, 끝난 점수에서 30,000점을 빼서 성적을 셉니다(6장 1조). 여기에 **순위점**을 더한 것이 포인트입니다. 예를 들어 42,000점으로 1위면 (42,000 − 30,000) ÷ 1,000 + 50 = +62포인트입니다.
    반환 점수가 시작 점수보다 높으면 그 차이를 네 명분 모은 몫(**오카**)이 1위에게 갑니다. M리그는 (30,000 − 25,000) × 4 = 20,000점입니다.
    일본어 「원점(原点)」은 룰에 따라 시작 점수를 가리키기도 하고(M리그 원문), 반환 점수를 가리키기도 합니다. 그래서 이 사이트는 「원점」 대신 시작 점수·반환 점수라고 씁니다.
  related: [juniten, uma, oka]
  sources:
    - https://m-league.jp/about/
    - https://ja.wikipedia.org/wiki/麻雀の点
    - /study/rules-mahjongsoul-vs-pro/
  check: false

- id: uma
  term: 우마
  ja: ウマ
  aka: [순위 우마]
  category: 점수
  short: 순위에 따라 아래 순위가 위 순위에게 주는 점수. 「10-30」처럼 부릅니다.
  tiles: null
  han: null
  rule_note: 작혼 단위전은 5-15(+15 / +5 / −5 / −15)입니다.
  detail: |
    「10-30」은 3위가 2위에게 1만 점, 4위가 1위에게 3만 점을 준다는 뜻으로, 순위점으로 +30 / +10 / −10 / −30입니다.
    M리그는 우마 10-30에 오카 +20을 더해 순위점이 1위 +50 · 2위 +10 · 3위 −10 · 4위 −30입니다(6장 2조).
  related: [oka, juniten, genten-kaeshi]
  sources:
    - https://m-league.jp/about/
    - /study/rules-mahjongsoul-vs-pro/
  check: false

- id: oka
  term: 오카
  ja: オカ
  aka: [톱 상]
  category: 점수
  short: 처음 나눠 받는 점수가 정산 때 빼는 점수보다 낮을 때(예 25,000점 시작·30,000점 정산), 그 차이를 모아 1위가 혼자 받는 몫.
  tiles: null
  han: null
  rule_note: 작혼 단위전은 25,000점으로 시작해 25,000점으로 정산해서 오카가 없습니다.
  detail: |
    M리그는 (30,000 − 25,000) × 4명 = 20,000점, 곧 **+20포인트**가 1위에게 갑니다. 그래서 1위의 가치가 특히 큽니다.
    M리그 룰 원문은 오카를 따로 적지 않고 순위점(1위 +50)에 넣어 두었습니다.
  related: [uma, juniten, genten-kaeshi]
  sources:
    - https://m-league.jp/about/
    - /study/rules-mahjongsoul-vs-pro/
  check: false

- id: juniten
  term: 순위점
  ja: 順位点
  aka: [순위 점수, 우마오카]
  category: 점수
  short: 반장이 끝난 뒤 순위에 따라 더하고 빼는 점수. 우마와 오카를 합친 것입니다.
  tiles: null
  han: null
  rule_note: 작혼 단위전은 +15 / +5 / −5 / −15입니다(25,000점으로 시작해 25,000점으로 정산해서 오카 없음).
  detail: |
    M리그는 1위 +50 · 2위 +10 · 3위 −10 · 4위 −30(1,000점 = 1포인트)입니다(6장 2조). 같은 점수면 순위점을 나눠 갖고, 3명이 같으면 기가에 가까운 사람이 끝수를 더 받습니다.
    M리그 포인트 = (끝난 점수 − 30,000) ÷ 1,000 + 순위점. 여러 룰을 같은 기준으로 비교한 표는 「작혼 룰 vs 프로 룰」에 있습니다.
  related: [uma, oka, genten-kaeshi, chicha]
  sources:
    - https://m-league.jp/about/
    - /study/rules-mahjongsoul-vs-pro/
  check: false

- id: tobi
  term: 토비
  ja: トビ / 飛び
  aka: [하코, 하코텐, 날기]
  category: 점수
  short: 누군가의 점수가 0점 아래로 내려가 반장이 그 자리에서 끝나는 것.
  tiles: null
  han: null
  rule_note: M리그에는 없습니다(0점 아래여도 끝까지 칩니다). 작혼에는 있습니다.
  detail: |
    작혼은 누군가의 점수가 0점 아래가 되면 반장이 바로 끝납니다. 그래서 점수가 적은 사람에게서 큰 점수를 론하면 그 자리에서 대국이 끝나기도 합니다.
    M리그는 점수가 없어져도 마지막 국까지 계속합니다(3장 2조 4).
  related: [orasu, tonpusen-hanchan]
  sources:
    - https://m-league.jp/about/
    - /study/rules-mahjongsoul-vs-pro/
  check: false

- id: daburon
  term: 더블론
  ja: ダブロン
  aka: [두 집 론, 더블 론, 다부론]
  category: 점수
  short: 한 패로 두 사람이 동시에 론 화료하는 것.
  tiles: null
  han: null
  rule_note: M리그에는 없습니다. 작혼에는 있습니다.
  detail: |
    작혼은 한 사람이 버린 패로 두 사람이 론하면 둘 다 화료하고, 버린 사람이 두 사람 몫을 모두 냅니다.
    M리그는 한 국의 화료자가 한 명뿐이라, 버린 사람의 하가 → 대면 → 상가 순서로 가까운 한 사람만 화료합니다(5장 1조 3). 일본어로 이것을 「아타마하네(頭ハネ)」라고 합니다.
  related: [ron, hoju, kamicha-shimocha-toimen]
  sources:
    - https://m-league.jp/about/
    - /study/rules-mahjongsoul-vs-pro/
  check: false

- id: sekinin-barai
  term: 책임지불
  ja: 責任払い / 包
  aka: [파오, 책임 지불, 포]
  category: 점수
  short: 역만을 확정시키는 패를 퐁·깡하게 해 준 사람이 그 역만 점수를 책임지는 규칙.
  tiles: null
  han: null
  rule_note: 작혼은 대삼원·대사희에 적용합니다(스깡쯔는 아님).
  detail: |
    M리그는 **대삼원·대사희·스깡쯔**에 적용합니다(8장 1조). 예를 들어 삼원패 2종을 이미 드러낸 사람에게 세 번째 삼원패를 퐁·깡하게 해 주면 책임자가 됩니다.
    그 사람이 쯔모로 화료하면 책임자가 혼자 다 내고, 다른 사람이 방총하면 방총한 사람과 책임자가 반씩 냅니다. 본장 점수는 책임자가 냅니다(M리그 8장).
  related: [daisangen, shosushi-daisushi, sukantsu, yakuman]
  sources:
    - https://m-league.jp/about/
    - /study/rules-mahjongsoul-vs-pro/
  check: false

# ═════════ 묶음 3 — 수비·전략 25개 (2026-11-14 확정, 마작껌 확인) ═════════
# ───────── 안전패 찾기 ─────────
- id: anzenhai
  term: 안전패 / 위험패
  ja: 安全牌 / 危険牌
  aka: [안파이, 안패, 안전 패, 위험 패]
  category: 수비·전략
  short: 버려도 론당하지 않거나 그럴 가능성이 낮은 패 / 론당할 가능성이 높은 패.
  tiles: null
  han: null
  rule_note: null
  detail: |
    리치가 걸리거나 텐파이로 보이는 사람이 있을 때, 그 사람에게 방총하지 않을 패를 **안전패**, 방총할 가능성이 높은 패를 **위험패**라고 합니다. 버린 패에 론이 나오지 않으면 「통했다」고 합니다.
    100% 안전한 것은 **현물**뿐입니다. 현물이 없으면 근거가 강한 순서로 고릅니다. 마작 갤러리의 수비 강의는 대략 이렇게 순서를 매깁니다.
    - 자패, 스지인 1·9 (샤보·단기에만 맞음)
    - 벽의 바깥쪽 패(**노찬스**)
    - 스지인 2·8, **나카스지**
    - 스지인 3·7, 근거 없는 1·9
    - **원찬스**
    근거가 하나도 없는 가운데 패(무스지 4·5·6)가 가장 위험합니다. 안전패는 「누구에게」 안전한지가 사람마다 다르다는 점도 함께 봅니다.
  related: [genbutsu, suji, kabe, nochansu-wanchansu, betaori, hoju]
  sources:
    - https://gall.dcinside.com/board/view/?id=majak&no=891380
    - https://namu.wiki/w/%EB%A6%AC%EC%B9%98%EB%A7%88%EC%9E%91/%EC%9A%A9%EC%96%B4
    - /study/riichi-101-6/
  check: false

- id: genbutsu
  term: 현물
  ja: 現物
  aka: [겐부쯔, 겐부츠]
  category: 수비·전략
  short: 그 사람이 이미 버려서, 그 사람에게는 절대 론당하지 않는 패.
  tiles: null
  han: null
  rule_note: null
  detail: |
    자기가 버린 패로는 론할 수 없다는 **후리텐** 규칙 때문에, 상대의 버림패와 같은 패는 그 상대에게 100% 안전합니다(M리그 5장 5조).
    리치한 사람에게는 현물이 더 늘어납니다. 리치 뒤에 다른 사람이 버렸는데 론이 나오지 않은 패도, 리치한 사람이 못 본 체한 것이 되어 그 국 끝까지 론할 수 없기 때문입니다.
    주의할 점은 **그 사람에게만** 안전하다는 것입니다. 두 사람이 리치했다면 두 사람 모두의 현물(공통 현물)을 찾아야 합니다.
  related: [anzenhai, furiten, betaori, awaseuchi, sutehai]
  sources:
    - https://m-league.jp/about/
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=121
    - /study/riichi-101-6/
  check: false

- id: suji
  term: 스지 / 무스지
  ja: 筋 / 無筋
  aka: [스지패, 줄기패, 근, 무근]
  category: 수비·전략
  short: 상대가 버린 패와 3 차이 나는 패(양면 대기에는 안 맞음) / 그런 근거가 없는 패.
  tiles: "147m 258p 369s"
  han: null
  rule_note: null
  detail: |
    양면 대기는 늘 3 차이 나는 두 패를 기다립니다(`23m` 은 `1m`·`4m`, `56m` 은 `4m`·`7m`). 그래서 상대가 `4m` 를 버렸다면 `1m`·`7m` 로는 양면 대기에 맞지 않습니다. 맞는다면 `4m` 도 화료패라 후리텐이기 때문입니다. 이 관계를 **스지**라고 하고, 묶음은 1-4-7, 2-5-8, 3-6-9 세 가지입니다.
    스지는 **양면만** 지워 줍니다. 간짱·변짱·샤보·단기에는 그대로 맞습니다.
    - 스지 1·9: 샤보·단기에만 맞음 → 꽤 안전
    - 스지 2·8: 간짱(`13m` 의 `2m`)에도 맞음
    - 스지 3·7: 간짱에 더해 변짱(`12m` 의 `3m`)에도 맞음 → 가장 덜 안전
    4·5·6은 양쪽 스지가 다 버려져야 양면이 지워집니다(**나카스지**). 스지 근거가 없는 패는 **무스지**라고 합니다.
  related: [nakasuji-katasuji, anzenhai, ryanmen, kanchan, hikkake, furiten]
  sources:
    - https://namu.wiki/w/%EB%A6%AC%EC%B9%98%EB%A7%88%EC%9E%91/%EC%9A%A9%EC%96%B4
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
    - https://gall.dcinside.com/board/view/?id=majak&no=891380
  check: false

- id: nakasuji-katasuji
  term: 나카스지 / 카타스지
  ja: 中筋 / 片筋
  aka: [가운데 스지, 편스지, 반스지]
  category: 수비·전략
  short: 양쪽 스지가 모두 버려진 4·5·6 / 한쪽 스지만 버려진 4·5·6.
  tiles: "1m 4m 7m"
  han: null
  rule_note: null
  detail: |
    `4m` 는 `23m` 양면(1·4m 대기)과 `56m` 양면(4·7m 대기) 두 쪽에 맞을 수 있습니다. 그래서 상대가 `1m` 와 `7m` 를 **둘 다** 버렸을 때만 양면이 지워지고, 이때의 `4m` 를 **나카스지**라고 합니다. 2·8이 버려졌을 때의 5, 3·9가 버려졌을 때의 6도 같습니다.
    `1m` 만 버려졌을 때의 `4m` 는 **카타스지**입니다. `56m` 양면에는 그대로 맞으므로 안전패로 보지 않고, 참고만 합니다.
    나카스지도 간짱(`35m` 의 `4m`)·샤보·단기에는 맞습니다.
  related: [suji, anzenhai, ryanmen, kanchan]
  sources:
    - https://namu.wiki/w/%EB%A6%AC%EC%B9%98%EB%A7%88%EC%9E%91/%EC%9A%A9%EC%96%B4
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=121
  check: false

- id: kabe
  term: 벽
  ja: 壁
  aka: [카베, 4장 벽]
  category: 수비·전략
  short: 어떤 수패 4장이 내 손과 버림패·후로에서 모두 보이는 상태.
  tiles: "7777p 89p"
  han: null
  rule_note: null
  detail: |
    `7p` 4장이 모두 보이면, 아무도 `7p` 를 써서 대기를 만들 수 없습니다. 그래서 `8p` 는 `67p` 양면과 `79p` 간짱에, `9p` 는 `78p` 양면에 맞지 않습니다. 이렇게 벽의 **바깥쪽 패**는 샤보·단기에만 맞는 패가 되고, 이것을 **노찬스**라고 합니다.
    조심할 점은 벽의 **안쪽 패**입니다. `7p` 가 벽이어도 `6p` 는 `45p` 양면에, `5p` 는 `34p` 양면에 그대로 맞습니다.
    벽은 「내 눈에 보이는 패」로 세므로, 내 손에 든 패도 함께 셉니다. 3장만 보일 때는 **원찬스**입니다.
  related: [nochansu-wanchansu, anzenhai, suji, shanpon, tanki]
  sources:
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
    - https://namu.wiki/w/%EB%A6%AC%EC%B9%98%EB%A7%88%EC%9E%91/%EC%9A%A9%EC%96%B4
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
  check: false

- id: nochansu-wanchansu
  term: 노찬스 / 원찬스
  ja: ノーチャンス / ワンチャンス
  aka: [노 찬스, 원 찬스, 3장 벽, 더블 원찬스]
  category: 수비·전략
  short: 벽(4장) 덕분에 순쯔 대기에는 맞지 않는 패 / 3장만 보여서 맞을 가능성이 조금 남은 패.
  tiles: "777p 89p"
  han: null
  rule_note: null
  detail: |
    `7p` 가 4장 다 보이면 `8p`·`9p` 는 양면·간짱에 맞을 길이 없어 **노찬스**입니다. 맞는다면 샤보나 단기뿐입니다.
    위 그림처럼 `7p` 가 3장만 보이면 **원찬스**입니다. 남은 한 장을 상대가 `67p` 나 `78p` 로 쓰고 있을 수 있어서, 근거 없는 패보다 조금 나은 정도로만 봅니다. 수비 강의에서도 원찬스는 안전도 순서의 맨 아래에 둡니다.
    옆의 두 패가 모두 3장씩 보이면(예: `7p`·`8p` 가 3장씩일 때의 `9p`) **더블 원찬스**라고 하고, 원찬스보다 조금 더 믿을 수 있습니다.
    커뮤니티에서는 「벽」과 「노찬스」를 같은 뜻으로 쓰기도 합니다.
  related: [kabe, anzenhai, suji, ryanmen]
  sources:
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
    - https://news.allabout.co.jp/articles/o/82494/
    - https://gall.dcinside.com/board/view/?id=majak&no=891380
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
  check: false

- id: shonpai
  term: 생패
  ja: 生牌
  aka: [숀파이, 쇼파이, 초패]
  category: 수비·전략
  short: 그 국에서 아직 한 장도 버려지지 않은 패.
  tiles: null
  han: null
  rule_note: null
  detail: |
    주로 자패, 그중에서도 역패에 대해 씁니다. 종반까지 한 장도 나오지 않은 역패는 누군가 또이쯔나 커쯔로 들고 있을 가능성이 커서, 버리면 퐁을 당하거나 샤보·단기에 맞을 수 있습니다.
    반대로 이미 2장, 3장 보인 자패는 맞을 수 있는 모양이 거의 남지 않아 안전패로 씁니다.
  related: [anzenhai, jihai, yakuhai, shibori, jigoku-machi]
