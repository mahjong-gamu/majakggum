# ───────── 점수: 판·부·점수 구간 ─────────
- id: han
  term: 판
  ja: 翻
  aka: [판수, 한, 翻]
  category: 점수
  short: 역과 도라로 세는 점수 단위. 판이 많을수록 점수가 높습니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    역마다 정해진 판수와 도라 수를 더한 것이 그 화료의 판수입니다. 예: 리치 1 + 탕야오 1 + 도라 2 = 4판.
    판수와 **부**로 점수를 구합니다. 5판부터는 부와 상관없이 만관 이상으로 정해집니다.
    - 5판 **만관** · 6~7판 **하네만** · 8~10판 **배만** · 11~12판 **삼배만** · 13판 이상은 룰에 따라 헤아림 역만(작혼) 또는 삼배만(M리그)
    이 사이트는 단위를 「판」, 개수를 말할 때 「판수」라고 씁니다.
