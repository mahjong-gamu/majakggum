- id: oya-ko
  term: 친 / 자
  ja: 親 / 子
  aka: [오야, 코, 친가, 자가]
  category: 진행·기본
  short: 그 국에서 친을 맡은 한 사람과, 나머지 세 사람.
  tiles: null
  han: null
  rule_note: null
  detail: |
    국마다 네 사람 중 한 명이 **친**, 나머지 세 명이 **자**가 됩니다. 친은 동가에 앉고, 친이 바뀌면 자리 바람(자풍)도 함께 한 칸씩 옮겨 갑니다.
    친은 화료하면 자보다 **1.5배** 점수를 받고, 쯔모를 당하면 자보다 두 배를 냅니다. 그래서 친일 때 공격적으로 치는 경우가 많습니다.
    친이 화료하거나 유국 때 텐파이면 친을 그대로 이어 가고(연장), 그렇지 않으면 오른쪽 사람(하가)에게 친이 넘어갑니다.
  related: [jikaze, renchan, kyoku]
  sources:
    - https://mahjongsoul.yo-star.com/kr/classroom
    - https://m-league.jp/about/
    - /study/riichi-101-2/
  check: false

- id: jikaze
  term: 자풍
  ja: 自風
  aka: [자풍패, 문풍]
  category: 진행·기본
  short: 내 자리의 바람. 친이 동, 그다음 차례가 남·서·북입니다.
  tiles: "1234z"
  han: null
  rule_note: null
  detail: |
    친이 **동**, 친의 오른쪽(다음 차례)이 **남**, 그다음이 **서**, 친의 왼쪽이 **북**입니다. 친이 바뀌면 모두의 자풍도 바뀝니다.
    자풍과 같은 풍패 3장(커쯔)을 모으면 **역패**로 1판이 됩니다. 자풍이 장풍과 같으면(예: 동장의 친에게 동) 두 번 세어 2판인 **연풍패**가 됩니다.
  related: [bakaze, kazehai, yakuhai, renpuhai, oya-ko]
  sources:
    - https://mahjongsoul.yo-star.com/kr/classroom
  check: false

