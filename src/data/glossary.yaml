# ───────── 버리는 방법 ─────────
- id: betaori
  term: 베타오리
  ja: ベタオリ
  aka: [오리, 내리기, 완전히 내리기, 베타 오리]
  category: 수비·전략
  short: 그 국의 화료를 포기하고, 손을 무너뜨려서라도 안전한 패만 버리는 것.
  tiles: null
  han: null
  rule_note: null
  detail: |
    리치가 걸렸는데 내 손이 멀거나 싸다면, 화료를 포기하고 방총만 피하는 쪽이 이득일 때가 많습니다. 수비로 돌아서는 것을 「내린다(오리)」고 하고, 화료 가능성을 아예 버리고 내리는 것이 베타오리입니다.
    버리는 순서는 **현물** → 자패·스지 1·9 → 벽의 바깥쪽 패 → 그 밖의 스지 순으로, 가장 안전한 것부터입니다. 완성된 몸통이나 또이쯔를 깨서라도 안전패를 냅니다.
    중간에 마음이 바뀌어 위험패를 버리면 내린 보람이 없어지므로, 내리기로 했으면 끝까지 내리는 것이 기본입니다.
  related: [anzenhai, genbutsu, mawashiuchi, oshihiki, zentsu, hoju]
  sources:
    - https://gall.dcinside.com/board/view/?id=majak&no=891380
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
  check: false

- id: mawashiuchi
  term: 마와시우치
  ja: 回し打ち
  aka: [돌려 치기, 마와시]
  category: 수비·전략
  short: 위험패는 버리지 않으면서, 손을 돌려 화료나 텐파이 가능성은 남겨 두는 것.
  tiles: null
  han: null
  rule_note: null
  detail: |
    베타오리와 끝까지 미는 것의 가운데입니다. 위험한 패가 들어오면 그 패를 쓰는 쪽으로 손 모양을 바꾸고, 대신 안전한 패를 버리면서 텐파이를 다시 노립니다.
    손이 느려지거나 점수가 내려가지만, 방총을 피하면서 화료나 유국 때 텐파이(노텐 벌점)를 챙길 수 있습니다. 안전패가 넉넉하고 손 모양에 여유가 있을 때 쓰기 좋습니다.
  related: [betaori, oshihiki, anzenhai, keishiki-tenpai, noten-bappu]
  sources:
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
    - https://gall.dcinside.com/board/view/?id=majak&no=596984
    - https://kanji.jepang.org/en/kosakata/%E5%9B%9E%E3%81%97%E6%89%93%E3%81%A1
  check: false

- id: awaseuchi
  term: 아와세우치
  ja: 合わせ打ち
  aka: [맞춰 치기, 따라 버리기]
  category: 수비·전략
  short: 다른 사람이 방금 버린 패와 같은 패를 따라 버리는 것.
  tiles: null
  han: null
  rule_note: null
  detail: |
    바로 앞 사람(상가)이 버린 패에 아무도 론하지 않았다면, 그 패를 내가 곧바로 따라 버려도 누구에게도 론당하지 않습니다. 화료패를 못 본 체한 사람은 자기 다음 쯔모 전까지 론할 수 없기 때문입니다(일시 후리텐, M리그 5장 5조).
    한 순이 지나면 이 근거는 사라집니다. 대면이나 하가가 버린 패는 그 뒤에 쯔모한 사람이 있으므로, 버린 본인에게만 현물입니다.
    리치가 없어도 누가 텐파이인지 모를 때 가장 쉬운 수비 방법입니다.
  related: [genbutsu, furiten, anzenhai, kamicha-shimocha-toimen, damaten]
  sources:
    - https://m-league.jp/about/
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=121
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
  check: false

- id: toitsu-otoshi
  term: 또이쯔 오토시
  ja: 対子落とし
  aka: [또이쯔오토시, 또이쯔 떨구기, 타쯔 오토시]
  category: 수비·전략
  short: 손에 있던 또이쯔 2장을 한 장씩 이어서 버리는 것.
  tiles: "11z"
  han: null
  rule_note: null
  detail: |
    수비에서는 안전한 또이쯔 하나로 **두 순**을 버틸 수 있어 자주 씁니다. 예를 들어 이미 2장 보인 자패 또이쯔는 누구에게도 맞지 않는 패 2장입니다.
    공격에서는 블록이 남을 때 약한 또이쯔를 정리하는 뜻으로도 씁니다. 타쯔 2장을 이어서 버리면 「타쯔 오토시」라고 합니다.
    상대가 또이쯔 오토시를 하면 손에 블록이 넉넉하다는 뜻이라, 텐파이가 가깝다고 읽는 단서가 됩니다.
  related: [toitsu, tatsu, betaori, anzenhai, burokku]
  sources:
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
    - https://namu.wiki/w/%EB%A6%AC%EC%B9%98%EB%A7%88%EC%9E%91/%EC%9A%A9%EC%96%B4
  check: false

- id: sakigiri
  term: 사키기리
  ja: 先切り
  aka: [먼저 버리기, 호패선타]
  category: 수비·전략
  short: 아직 쓸모가 있는 패를, 나중에 위험해지기 전에 미리 버리는 것.
  tiles: null
  han: null
  rule_note: null
  detail: |
    손에 여유가 있을 때 가운데 쪽 패를 먼저 버리고, 그 자리에 안전패를 들고 가는 방법입니다. 유효패가 조금 줄어드는 대신, 나중에 리치가 걸렸을 때 버릴 패가 생깁니다.
    일찍 버린 패 주변은 상대가 안전하다고 여기기 쉬워서, 그쪽 대기가 잘 나오게 하는 효과를 노리기도 합니다.
  related: [anzenhai, haikoritsu, yukohai, hikkake]
  sources:
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
    - https://gall.dcinside.com/board/view/?id=majak&no=596984
  check: false

# ───────── 공수 판단 ─────────
- id: oshihiki
  term: 공수 판단
  ja: 押し引き
  aka: [오시히키, 밀고 당기기, 공수판단]
  category: 수비·전략
  short: 상대의 공격에 맞서 화료를 향해 밀지, 방총을 피해 내릴지 정하는 판단.
  tiles: null
  han: null
  rule_note: null
  detail: |
    일본어로는 밀기(押し)와 당기기(引き)를 합쳐 「오시히키」라고 합니다. 너무 밀어도, 너무 내려도 성적이 나빠진다고 해서 실력의 중심으로 꼽힙니다.
    보통 이런 것을 함께 봅니다.
    - **내 손**: 텐파이인지 몇 샹텐인지, 대기가 양면인지, 점수가 얼마인지
    - **상대**: 친의 리치인지, 점수가 높아 보이는지, 몇 순째인지
    - **버릴 패**: 지금 버려야 하는 패가 얼마나 위험한지, 안전패가 남아 있는지
    - **점수 상황**: 순위와 남은 국 수(오라스에 가까울수록 크게 달라짐)
    밀기로 하면 끝까지 미는 **젠츠**, 내리기로 하면 **베타오리**, 그 사이가 **마와시우치**입니다.
  related: [betaori, mawashiuchi, zentsu, sensei-okkake-riichi, shanten, orasu]
  sources:
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=121
    - https://namu.wiki/w/%EB%A6%AC%EC%B9%98%EB%A7%88%EC%9E%91/%EC%9A%A9%EC%96%B4
  check: false

- id: zentsu
  term: 젠츠
  ja: 全ツッパ
  aka: [젠츳파, 풀젠츠, 뚫기, 전부 밀기]
  category: 수비·전략
  short: 리치가 걸려도 물러서지 않고, 필요 없는 패는 위험패라도 모두 버리며 화료를 노리는 것.
  tiles: null
  han: null
  rule_note: null
  detail: |
    일본어 「젠부 츳파리(전부 밀어붙이기)」를 줄인 말입니다. 내 손이 이미 좋은 대기의 텐파이이거나 점수가 높을 때, 또는 오라스에 화료하지 않으면 순위가 오르지 않을 때 고릅니다.
    근거 없이 늘 젠츠만 하면 방총이 늘어납니다. 밀 만한 손인지 따져 보는 것이 **공수 판단**입니다.
  related: [oshihiki, betaori, mawashiuchi, hoju, sensei-okkake-riichi]
  sources:
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=121
    - https://namu.wiki/w/%EB%A6%AC%EC%B9%98%EB%A7%88%EC%9E%91/%EC%9A%A9%EC%96%B4
  check: false

- id: sashikomi
  term: 사시코미
  ja: 差し込み
  aka: [일부러 방총, 걸려들기]
  category: 수비·전략
  short: 다른 사람의 화료패로 보이는 패를 일부러 버려 방총하는 것.
  tiles: null
  han: null
  rule_note: null
  detail: |
    손해처럼 보이지만 더 큰 손해를 막으려고 씁니다. 예를 들어 친이 높은 손으로 리치했을 때, 싼 손으로 후로한 다른 사람에게 일부러 방총해서 그 국을 끝내는 경우입니다. 오라스에 내 순위가 바뀌지 않는 점수라면, 방총해서 대국을 끝내 순위를 지키기도 합니다.
    상대의 대기와 점수를 꽤 정확히 읽어야 해서 어려운 기술입니다.
  related: [hoju, oshihiki, orasu, shibori, furo]
  sources:
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
    - https://gall.dcinside.com/board/view/?id=majak&no=596984
  check: false

# ───────── 상대를 보는 수 ─────────
- id: shibori
  term: 시보리
  ja: 絞り
  aka: [묶기, 조이기]
  category: 수비·전략
  short: 다른 사람이 울 것 같은 패를 버리지 않고 쥐고 있는 것.
  tiles: null
  han: null
  rule_note: null
  detail: |
    치는 상가의 패로만 할 수 있어서, 주로 **하가**를 상대로 씁니다. 하가가 삭수 혼일색으로 보이면 삭수와 생패인 역패를 내주지 않는 식입니다.
    내 손은 그만큼 느려지므로, 내 손이 화료하기 어려울 때나 하가의 손이 높아 보일 때 고릅니다. 반대로 일부러 울 패를 내주는 것은 「어시스트」라고 합니다.
  related: [furo, chi, pon, kamicha-shimocha-toimen, shonpai, sashikomi]
  sources:
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=120
    - https://gall.dcinside.com/board/view/?id=majak&no=596984
  check: false

- id: hikkake
  term: 힛카케
  ja: 引っ掛け
  aka: [스지 낚시, 스지힛카케, 낚시 리치, 히카케, 모로힛카케]
  category: 수비·전략
  short: 내가 버린 패의 스지로 기다리는 것. 스지를 믿고 버린 패를 노립니다.
  tiles: "13m"
  han: null
  rule_note: null
  detail: |
    `135m` 에서 `5m` 를 버리고 위 그림의 `13m` 간짱으로 리치하면 대기는 `2m` 입니다. 다른 사람이 보기에 `2m` 는 `5m` 의 스지라 안전해 보여서 나오기 쉽습니다.
    스지는 양면만 지워 주고 간짱·샤보·단기는 못 지운다는 점을 이용한 것입니다. 리치 선언패의 스지로 기다리면 「모로힛카케」라고 따로 부릅니다.
    수비하는 쪽에서는, 스지라도 3·7이나 리치 선언패의 스지는 조금 더 조심합니다.
  related: [suji, kanchan, riichi, riichi-sengenhai, sakigiri]
  sources:
    - https://gall.dcinside.com/mgallery/board/view/?id=riichimahjong&no=121
    - https://gall.dcinside.com/board/view/?id=majak&no=596984
    - https://ja.wikipedia.org/wiki/麻雀用語一覧
  check: false

- id: jigoku-machi
  term: 지옥 대기
  ja: 地獄待ち
  aka: [지옥 단기, 지옥단기, 지옥대기, 지고쿠마치]
  category: 수비·전략
  short: 이미 여러 장이 보여서 한 장밖에 남지 않은 패를 기다리는 대기.
  tiles: "234m567p123789s 4z"
  han: null
  rule_note: null
  detail: |
    위 그림은 북 `4z` 단기입니다. 북이 버림패에 이미 2장 보인다면 남은 것은 한 장뿐이라 지옥 대기입니다(단기일 때는 「지옥 단기」라고도 합니다).
    한 장뿐이라 화료하기 어려워 보이지만, 다른 사람에게는 2장 보인 자패가 가장 안전한 패로 보여서 수비하는 사람 손에서 나오기 쉽습니다.
    수비하는 쪽에서는 2장 보인 자패도 100%는 아니라는 점만 기억해 두면 됩니다.
  related: [tanki, jihai, shonpai, anzenhai, hikkake]
