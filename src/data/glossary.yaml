# ───────── 유국 ─────────
- id: ryukyoku
  term: 유국
  ja: 流局
  aka: [황패 유국, 류쿄쿠]
  category: 유국
  short: 아무도 화료하지 못하고 국이 끝나는 것.
  tiles: null
  han: null
  rule_note: 작혼은 구종구패·사풍연타·사깡유국·사가리치로 국을 중간에 끝내는 도중 유국이 있습니다.
  detail: |
    보통은 패산을 다 쓸 때까지 화료가 없으면 유국입니다. 이때 각자 텐파이인지 밝히고, 노텐이 텐파이에게 **노텐 벌점**을 냅니다. 친이 텐파이면 연장, 노텐이면 친이 넘어갑니다. 어느 쪽이든 본장이 1개 늘고, 리치봉은 공탁으로 남습니다.
    M리그는 국을 중간에 끝내는 유국(도중 유국)이 없습니다(3장 11조 1).
  related: [noten-bappu, tochu-ryukyoku, renchan, honba, kyotaku]
  sources:
    - https://m-league.jp/about/
    - /study/rules-mahjongsoul-vs-pro/
  check: false

- id: noten-bappu
  term: 노텐 벌점
  ja: ノーテン罰符
  aka: [텐파이료, 불청벌부]
  category: 유국
  short: 유국 때 노텐인 사람이 텐파이한 사람에게 주는 모두 3,000점.
  tiles: null
  han: null
  rule_note: null
  detail: |
    3,000점을 노텐인 사람이 나눠 내고, 텐파이인 사람이 나눠 받습니다.
    - 텐파이 1명: 노텐 3명이 1,000점씩 → 텐파이가 3,000점
    - 텐파이 2명: 노텐 2명이 1,500점씩 → 텐파이가 1,500점씩
    - 텐파이 3명: 노텐 1명이 3,000점 → 텐파이가 1,000점씩
    - 4명 모두 텐파이나 모두 노텐: 주고받지 않음
    M리그도 3,000점입니다(3장 11조 5).
  related: [ryukyoku, noten, tenpai, keishiki-tenpai]
  sources:
    - https://m-league.jp/about/
    - /study/rules-mahjongsoul-vs-pro/
  check: false

- id: keishiki-tenpai
  term: 형식 텐파이
  ja: 形式聴牌
  aka: [형텐, 역 없는 텐파이]
  category: 유국
  short: 역이 없어 화료는 못 하지만 모양은 텐파이인 상태. 유국 때 텐파이로 인정됩니다.
  tiles: "234789m11p56s 9^99p"
  han: null
  rule_note: null
  detail: |
    종반에 노텐 벌점을 받으려고, 또는 친을 이어 가려고 역이 없어도 치·퐁으로 텐파이 모양만 만드는 것입니다. M리그는 유국 때 텐파이를 판단할 때 **역 유무를 묻지 않습니다**(3장 11조 3).
    위 예는 `9p` 를 퐁해서 역이 없지만 `4s`·`7s` 를 기다리는 형식 텐파이입니다.
    단, 화료패 4장을 내가 다 쓰고 있는 대기(예: `1111m` 을 가진 `1m` 단기)는 텐파이로 치지 않습니다(3장 11조 2).
  related: [tenpai, noten-bappu, ryukyoku, furo]
  sources:
    - https://m-league.jp/about/
  check: false

