# ───────── 역: 기본 ─────────
- id: yaku
  term: 역
  ja: 役
  aka: [야쿠, 화료 역]
  category: 역
  short: 화료하려면 꼭 하나 이상 있어야 하는 정해진 조건. 역마다 판수가 정해져 있습니다.
  tiles: null
  han: null
  rule_note: null
  detail: |
    손이 화료형(몸통 4개 + 머리 1개 등)이어도 **역이 1판 이상** 없으면 화료할 수 없습니다. 도라는 판수를 늘려 주지만 역이 아니라서, 도라만으로는 화료할 수 없습니다(M리그 1장 3조, 작혼 마작 교실).
    역은 후로했을 때 어떻게 되는지에 따라 셋으로 나뉩니다.
    - **멘젠 한정**: 후로하면 없어짐(리치·핑후·이페코 등)
    - **후로하면 1판 줄어듦**: 삼색동순·일기통관·찬타·혼일색·준찬타·청일색
    - **후로해도 그대로**: 역패·탕야오·또이또이 등
    여러 역이 겹치면 판수를 모두 더합니다. 역만은 판수를 세지 않고 바로 역만 점수가 됩니다.
  related: [agari, han, yakuman, dora, menzen, furo]
  sources:
    - https://mahjongsoul.yo-star.com/kr/classroom
    - https://m-league.jp/about/
    - /study/riichi-101-5/
    - /study/riichi-101-8/
  check: false

- id: yakuman
  term: 역만
  ja: 役満
  aka: [야쿠만]
  category: 역
  short: 판수를 세지 않고 한 번에 가장 높은 점수(자 32,000 · 친 48,000)를 받는 역.
  tiles: null
  han: null
  rule_note: 작혼은 스안커 단기·국사무쌍 13면 대기·순정구련보등·대사희를 더블 역만으로 치고, 13판 이상은 헤아림 역만입니다. M리그는 둘 다 없습니다(역만끼리 겹칠 때만 2배·3배).
  detail: |
    국사무쌍·스안커·대삼원처럼 아주 만들기 어려운 손에 붙는 역입니다. 역만이 되면 다른 역·도라는 세지 않고 **자 32,000점, 친 48,000점**입니다.
    M리그는 서로 다른 역만이 2개 겹치면 2배, 3개면 3배로 계산합니다(6장 6조 1). 역만이 아닌 역은 아무리 많이 겹쳐도 **삼배만이 최고**라서, 헤아림 역만은 없습니다(6장 6조 2).
    M리그의 역만 12가지: 천화, 지화, 국사무쌍, 스안커, 대삼원, 녹일색, 자일색, 소사희, 대사희, 청노두, 스깡쯔, 구련보등(9장 5조).
  related: [daburu-yakuman, kazoe-yakuman, sanbaiman, kokushi-muso, suanko, daisangen, sekinin-barai]
  sources:
    - https://m-league.jp/about/
